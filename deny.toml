# cargo deny — licenses + advisory DB (CI). See https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = true

[advisories]
version = 2
db-urls = ["https://github.com/RustSec/advisory-db"]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "OpenSSL",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
