[package]
name = "libgary-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "libgary v0 cryptographic core (X3DH transcript, HKDF, AEAD, ratchet)"

[dependencies]
chacha20poly1305 = { version = "0.10", features = ["stream"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
subtle = "2.5"
thiserror = "1.0"
x25519-dalek = { version = "2", features = ["static_secrets"] }

libgary-wire = { path = "../libgary-wire" }

[dev-dependencies]
ed25519-dalek = "2"
hex = "0.4"
x25519-dalek = { version = "2", features = ["static_secrets"] }
