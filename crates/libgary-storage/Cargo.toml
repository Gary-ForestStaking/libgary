[package]
name = "libgary-storage"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "libgary v0 atomic session persistence + rollback detection"

[dependencies]
libgary-core = { path = "../libgary-core" }
sha2 = "0.10"
thiserror = "1.0"

[dev-dependencies]
ed25519-dalek = "2"
hex = "0.4"
libgary-wire = { path = "../libgary-wire" }
rand_chacha = "0.3"
rand_core = "0.6"
tempfile = "3"
x25519-dalek = { version = "2", features = ["static_secrets"] }
