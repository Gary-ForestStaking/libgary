# Snippet for nginx-proxy stacks (e.g. shelkit): replace the static lgry-monmilios-web
# service with this, or merge equivalent fields into docker-compose.yml.
#
# Build context = clone of libgary on the server:
#   docker compose -f docker-compose.yml -f deploy/lgry-relay.compose.yml build lgry-relay
#
services:
  lgry-relay:
    build:
      context: ..
      dockerfile: crates/libgary-relay/Dockerfile
    expose:
      - "8080"
    environment:
      - VIRTUAL_HOST=lgry.monmilios.com
      - VIRTUAL_PORT=8080
      - LETSENCRYPT_HOST=lgry.monmilios.com
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-christopher.dowle@forestinfra.com}
      - RUST_LOG=libgary_relay=info,tower_http=info
    restart: unless-stopped
    networks:
      - proxy
